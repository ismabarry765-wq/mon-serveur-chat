<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Contrôle Groq IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #ffffff; color: #0d0d0d; display: flex; height: 100vh; overflow: hidden; }

        /* AUTH MODAL */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-box { background: #ffffff; padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center; }
        .auth-box h2 { margin-bottom: 20px; font-size: 1.3rem; }
        .auth-box input { width: 100%; padding: 10px 14px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; }
        .auth-box button { width: 100%; padding: 10px; background: #0d0d0d; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .auth-toggle { margin-top: 15px; font-size: 0.85rem; color: #2563eb; cursor: pointer; }

        /* NOTIFICATION BAR */
        #notification-bar { position: fixed; top: 15px; right: 15px; background: #10b981; color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; display: none; z-index: 1001; }

        /* SIDEBAR CHATGPT STYLE */
        #sidebar { width: 260px; background-color: #f9fafb; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        #sidebar.closed { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-bottom: 5px; }
        .chat-item:hover, .chat-item.active { background: #e5e7eb; }

        /* MAIN MONITOR */
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; background: #ffffff; }
        .toggle-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; }

        #groq-monitor { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
        
        .card { padding: 16px; border-radius: 12px; border: 1px solid #e5e7eb; background: #ffffff; }
        .card-question { border-left: 4px solid #2563eb; background: #f8fafc; }
        .card-thought { border-left: 4px solid #f59e0b; background: #fffbeb; font-style: italic; color: #92400e; font-size: 0.9rem; }
        .card-response { border-left: 4px solid #10b981; background: #f0fdf4; }
    </style>
</head>
<body>

    <div id="notification-bar">Notification</div>

    <div id="auth-modal">
        <div class="auth-box">
            <h2 id="auth-title">Connexion Groq Admin</h2>
            <input type="text" id="auth-username" placeholder="Pseudo">
            <input type="password" id="auth-password" placeholder="Mot de passe">
            <button onclick="handleAuth()" id="auth-btn">Se connecter</button>
            <div class="auth-toggle" onclick="toggleAuthMode()" id="auth-toggle-btn">Pas encore de compte ? S'inscrire</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <strong>🤖 Groq Monitor</strong>
            <button class="toggle-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="chat-list" id="questions-list">
            <div style="padding: 10px; color: #6b7280; font-size: 0.85rem;">Chargement des sessions...</div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <span id="user-display" style="font-size: 0.9rem; font-weight: bold; color: #4b5563;">Session Groq</span>
        </header>

        <div id="groq-monitor">
            <div style="text-align: center; color: #9ca3af; margin-top: 40px;">Sélectionnez une question dans le menu latéral pour voir les pensées et réponses de Groq.</div>
        </div>
    </div>

    <script>
        let isSignUp = false;
        let currentUser = null;
        let allQuestions = [];

        function showNotification(text, isError = false) {
            const bar = document.getElementById('notification-bar');
            bar.innerText = text;
            bar.style.background = isError ? '#ef4444' : '#10b981';
            bar.style.display = 'block';
            setTimeout(() => { bar.style.display = 'none'; }, 3000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Inscription" : "Connexion";
            document.getElementById('auth-btn').innerText = isSignUp ? "S'inscrire" : "Se connecter";
            document.getElementById('auth-toggle-btn').innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) return showNotification("Champs requis", true);

            const endpoint = isSignUp ? '/api/register' : '/api/login';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser = username;
                    document.getElementById('user-display').innerText = "👤 " + currentUser;
                    document.getElementById('auth-modal').style.display = 'none';
                    showNotification(data.message);
                    fetchQuestions();
                } else {
                    showNotification(data.error, true);
                }
            } catch (e) {
                showNotification("Erreur serveur", true);
            }
        }

        async function fetchQuestions() {
            try {
                const res = await fetch('/recuperer-questions');
                if (res.ok) {
                    const data = await res.json();
                    allQuestions = data.questions || [];
                    renderSidebar();
                }
            } catch(e){}
        }

        function renderSidebar() {
            const list = document.getElementById('questions-list');
            list.innerHTML = '';
            allQuestions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerText = "💬 " + q.username;
                div.onclick = () => showGroqDetails(q);
                list.appendChild(div);
            });
        }

        function showGroqDetails(q) {
            const monitor = document.getElementById('groq-monitor');
            monitor.innerHTML = '';

            q.messages.forEach(m => {
                if (m.sender !== "Groq IA") {
                    const box = document.createElement('div');
                    box.className = 'card card-question';
                    box.innerHTML = `<strong>❓ Question de ${m.sender}:</strong><br>${m.text}`;
                    monitor.appendChild(box);
                } else {
                    if (m.thought) {
                        const thoughtBox = document.createElement('div');
                        thoughtBox.className = 'card card-thought';
                        thoughtBox.innerHTML = `<strong>🧠 Pensée de Groq :</strong><br>${m.thought}`;
                        monitor.appendChild(thoughtBox);
                    }
                    const resBox = document.createElement('div');
                    resBox.className = 'card card-response';
                    resBox.innerHTML = `<strong>🤖 Réponse de Groq :</strong><br>${m.text}`;
                    monitor.appendChild(resBox);
                }
            });
        }

        setInterval(fetchQuestions, 3000);
    </script>
</body>
</html>
